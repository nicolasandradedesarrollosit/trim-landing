# Type check and build on every push and pull request.
# Deploys are handled by Vercel's Git integration (production on main, previews on
# other branches/PRs); this workflow only catches broken builds early, e.g. a missing
# key in src/config/copy.json or invalid product frontmatter.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Build
        run: npm run build
